name: Amex Bank of Canada
kind: company
description: >-
  Amex Bank of Canada is the Canadian banking subsidiary of the American Express
  Company (United States), incorporated in 1990 and headquartered in the Toronto
  area (Markham, Ontario). It is a Schedule II bank under Canada's Bank Act — a
  foreign-bank subsidiary regulated by the Office of the Superintendent of
  Financial Institutions (OSFI) and treated as a Category II small-and-medium-sized
  deposit-taking institution — and it issues American Express charge and credit
  cards to Canadian consumers and businesses. As a card-centric Schedule II bank,
  Amex Bank of Canada runs no first-party developer portal of its own; the global
  American Express developer platform at developer.americanexpress.com is operated
  by the U.S. parent (a separate profile), not by this Canadian entity. Canada's
  federal Consumer-Driven Banking (open-banking) framework, legislated in Budget
  2024 and the 2024 Fall Economic Statement with the Financial Consumer Agency of
  Canada (FCAC) as overseer, is not yet operational, so consumer data access to
  Amex-Canada accounts today is voluntary and largely aggregator-based rather than
  served by a public first-party API. This is an identity/provider record; no
  public Canadian API surface is documented.
