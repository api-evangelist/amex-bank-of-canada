actions:
  openapiHarvested: false
  reason: >-
    No first-party OpenAPI/Swagger is published by Amex Bank of Canada. The
    global Amex developer products belong to the U.S. parent and are
    partner-gated without downloadable specifications, so nothing was harvested
    into openapi/. Identity-only (built-stub) record is the correct, honest
    result.
